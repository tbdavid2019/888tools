name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test online clock
        run: pnpm exec vitest run src/tools/online-clock/online-clock.test.ts --environment jsdom -t 'accepts only supported mode values|renders all 4 modes|uses a shared URL mode'
        env:
          TZ: Asia/Taipei

      - name: Build site
        run: pnpm build
        env:
          BASE_URL: /
          VITE_SITE_ORIGIN: https://tool.david888.com
          VITE_APP_ENV: production
          VITE_P2P_ROOM_SIGNALING_URL: https://david888-p2p-room-signal.oobwei.workers.dev

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

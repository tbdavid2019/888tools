  <g transform="translate(226 255) scale(2.5)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" filter="url(#glow)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z" />
  </g>

  <path d="M145 342h222" stroke="#2dd4bf" stroke-linecap="round" stroke-width="6" opacity=".42" />
  <text x="256" y="425" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="15" text-anchor="middle">TOOL</text>
